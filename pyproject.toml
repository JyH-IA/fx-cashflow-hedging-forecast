[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxhedge"
version = "0.1.0"
description = "USD/MXN and cash-flow forecasting to support FX forward hedging decisions (educational; the internal business data is synthetic)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "yfinance>=0.2.40",
    "holidays>=0.40",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.14,<1",
    "prophet>=1.1.5,<2",
    "lightgbm>=4.1,<5",
    "xgboost>=2.0,<4",
    "optuna>=3.5,<5",
    "shap>=0.44",
    "matplotlib>=3.8,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "streamlit>=1.30",
    "plotly>=5.18,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.8",
    "pytest>=8",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "pip-audit>=2.7",
    "pre-commit>=3.6",
    "nbstripout>=0.7",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/fxhedge --cov-report=term-missing"
