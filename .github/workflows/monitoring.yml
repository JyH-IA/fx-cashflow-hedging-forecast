name: Drift report (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e .
      - name: Build synthetic data and features (no secrets are used)
        run: |
          python -m fxhedge.sample_data
          python -m fxhedge.feature_engineering
      - name: Write the drift report
        run: python -m fxhedge.monitoring
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: reports/monitoring/
